[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ALL_to_MD_desktop"
version = "0.2.0"
description = "Cross-platform desktop GUI converter to Markdown powered by Microsoft MarkItDown"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Azim Sharafutdinov" }
]
keywords = ["markdown", "markitdown", "converter", "all-to-md", "pdf-to-markdown", "pyqt6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "markitdown[all]>=0.1.1",
    "PyQt6>=6.6.0",
    "openai>=1.50.0",
]

[project.Optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "ruff>=0.6.0",
]

[project.gui-scripts]
all-to-md = "all_to_md_desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"